<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 250" width="600" height="250">
  <style>
    .bg { fill: #0d1117; stroke: #30363d; stroke-width: 1.5; rx: 8; }
    .text-main { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; fill: #c9d1d9; font-size: 15px; }
    .text-title { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; fill: #58a6ff; font-size: 24px; font-weight: 600; }
    .text-accent { fill: #8b949e; font-size: 14px; }
    .text-tech { fill: #79c0ff; font-weight: 600; }
    .dot { fill: #3fb950; animation: pulse 2.5s infinite ease-in-out; }
    .cursor { fill: #c9d1d9; animation: blink 1s step-end infinite; }
    .fade-in { animation: fadeIn 0.8s ease-out forwards; opacity: 0; }
    
    .delay-1 { animation-delay: 0.3s; }
    .delay-2 { animation-delay: 0.6s; }
    .delay-3 { animation-delay: 0.9s; }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(0.95); }
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }
    
    /* Smooth Typewriter & Eraser Effect */
    .typewriter-mask {
      animation: typeReveal 5s infinite;
    }
    @keyframes typeReveal {
      0% { transform: translateX(0); animation-timing-function: ease-out; } /* Fluid start */
      40% { transform: translateX(190px); } /* Full text revealed */
      60% { transform: translateX(190px); animation-timing-function: ease-in; } /* Pause to read */
      80% { transform: translateX(0); } /* Fluid wipe backwards */
      100% { transform: translateX(0); } /* Pause while blank */
    }
  </style>

  <!-- Background -->
  <rect x="2" y="2" width="596" height="246" class="bg" />

  <!-- Top Bar -->
  <text x="25" y="32" class="text-main text-accent">~/_ [ Karma.profile // status ]</text>
  <line x1="2" y1="45" x2="598" y2="45" stroke="#30363d" stroke-width="1.5" />

  <!-- Online Status -->
  <g class="fade-in">
    <circle cx="32" cy="78" r="6" class="dot" />
    <text x="48" y="83" class="text-main" fill="#3fb950" font-weight="600" letter-spacing="1">ONLINE</text>
  </g>

  <!-- Profile Info -->
  <g class="fade-in delay-1">
    <text x="25" y="125" class="text-title">Karma Patel</text>
    <text x="25" y="150" class="text-main text-accent">Backend Developer</text>
  </g>

  <!-- Tech Stack -->
  <g class="fade-in delay-2">
    <text x="25" y="185" class="text-main">
      <tspan class="text-tech">Python</tspan> • <tspan class="text-tech">Flask</tspan> • <tspan class="text-tech">SQL</tspan> • <tspan class="text-tech">Cloud</tspan> • <tspan class="text-tech">AI</tspan>
    </text>
  </g>

  <!-- Current Project with Smooth Masking Effect -->
  <g class="fade-in delay-3">
    <!-- Static Prefix -->
    <text x="25" y="220" class="text-main" fill="#d2a8ff">⚡ Currently building:</text>
    
    <!-- Text to be revealed -->
    <text x="225" y="220" class="text-main">Service Ticket System</text>
    
    <!-- Smooth sliding mask -->
    <g class="typewriter-mask">
      <rect x="223" y="200" width="220" height="26" fill="#0d1117" />
      <text x="223" y="220" class="text-main cursor">_</text>
    </g>
  </g>
</svg>
